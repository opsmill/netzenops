<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetZenOps</title>
    <meta name="description" content="Affirmations for the network automation engineer." />
    <meta property="og:title" content="NetZenOps" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Affirmations for the network automation engineer." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />

    <!-- Start of Reo Javascript -->
    <script type="text/javascript">
      !function(){var e,t,n;e="cecb9ced66c4e45",t=function(){Reo.init({clientID:"cecb9ced66c4e45"})},(n=document.createElement("script")).src="https://static.reo.dev/"+e+"/reo.js",n.defer=!0,n.onload=t,document.head.appendChild(n)}();
    </script>
    <!-- End of Reo Javascript -->
  </head>
  <body>
    <canvas id="topology" aria-hidden="true"></canvas>

    <main id="stage">
      <button id="enter" type="button">FIND MY AUTOMATION ZEN</button>
      <p id="quote" class="quote" aria-live="polite" hidden></p>
    </main>

    <div id="controls" class="controls" hidden>
      <button id="mute" class="mute" type="button" aria-label="Mute" aria-pressed="false" title="Mute (M)">
        <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" />
          <path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
        </svg>
        <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" />
          <path class="wave" d="M16.5 9.5l5 5M21.5 9.5l-5 5" />
        </svg>
      </button>
      <div id="ambience" class="ambience">
        <button class="ambience-button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="ambience-menu" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 14v-2a8 8 0 0 1 16 0v2" />
            <rect x="3" y="14" width="4" height="6" rx="1.5" />
            <rect x="17" y="14" width="4" height="6" rx="1.5" />
          </svg>
          <span class="visually-hidden">Background sound:</span>
          <span class="ambience-current">Tuning in</span>
        </button>
        <button class="ambience-hint" type="button" tabindex="-1" aria-hidden="true" hidden>
          Psst. Automating from somewhere noisier? Pick your habitat.
        </button>
        <div id="ambience-menu" class="ambience-menu" hidden>
          <p id="ambience-title" class="ambience-title">Where are you automating from today?</p>
          <p class="ambience-subtitle">Every network engineer's natural habitat, now in ambient sound.</p>
          <ul role="listbox" aria-labelledby="ambience-title" tabindex="-1"></ul>
        </div>
      </div>
    </div>

    <a class="suggest" href="https://github.com/opsmill/netzenops/blob/main/quotes.md" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20h4L19 9l-4-4L4 16v4z" />
        <path d="M13.5 6.5l4 4" />
      </svg>
      Suggest a quote
    </a>

    <footer class="footer">
      <a href="https://opsmill.com" target="_blank" rel="noopener">
        an <img class="brand" src="img/opsmill-logo.svg" alt="OpsMill" /> production
      </a>
    </footer>

    <script src="app.js" type="module"></script>
  </body>
</html>
